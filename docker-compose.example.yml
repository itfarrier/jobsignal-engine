services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=REPLACE_WITH_YOUR_PASSWORD
      - POSTGRES_DB=n8n
    volumes:
      - db_storage:/var/lib/postgresql/data

  nocodb-postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=nocodb_user
      - POSTGRES_PASSWORD=REPLACE_WITH_YOUR_PASSWORD
      - POSTGRES_DB=nocodb_db
    volumes:
      - nocodb_db_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocodb_user -d nocodb_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=REPLACE_WITH_YOUR_PASSWORD
      - N8N_METRICS=true
      - N8N_SECURE_COOKIE=true
      # Replace with your domain, or remove if running locally
      - WEBHOOK_URL=https://your-domain.com/
      - NOCDB_API_TOKEN=REPLACE_WITH_TOKEN
      - NOCDB_HOST=http://nocodb:8080
    volumes:
      - n8n_storage:/home/node/.n8n
      - shared_tmp:/tmp/jobsignal
    depends_on:
      - db

  nocodb:
    image: nocodb/nocodb:latest
    restart: always
    depends_on:
      nocodb-postgres:
        condition: service_healthy
    environment:
      - NC_DB=pg://nocodb-postgres:5432?u=nocodb_user&p=REPLACE_WITH_YOUR_PASSWORD&d=nocodb_db
      - NC_AUTH_JWT_SECRET=REPLACE_WITH_YOUR_JWT_SECRET
      - NC_PUBLIC_URL=https://nocodb.yourdomain.com
      - NC_ATTACHMENT_FIELD_SIZE=20971520
      - NC_DISABLE_TELE=true
    ports:
      - "8080:8080"
    volumes:
      - nocodb_data:/usr/app/data

  cv-renderer:
    build:
      context: .
      dockerfile: scripts/Dockerfile.cv-renderer
    restart: always
    volumes:
      - shared_tmp:/tmp/jobsignal
      - ./scripts:/opt/jobsignal
    expose:
      - "3456"

  # Self-hosted only — requires 2GB+ RAM to run alongside cv-renderer
  jobspy-scanner:
    build:
      context: .
      dockerfile: scripts/Dockerfile.jobspy
    restart: always
    expose:
      - "3457"

volumes:
  db_storage:
  n8n_storage:
  caddy_data:
  caddy_config:
  shared_tmp:
  nocodb_db_storage:
  nocodb_data: